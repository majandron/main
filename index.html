<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS CRUSHER — A Sanofi Road Trip</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Courier New',monospace; overflow:hidden; }

#gameContainer { position:fixed; inset:0; }
canvas { display:block; }

/* ── HUD ─────────────────────────────────────────── */
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 18px;
  background:rgba(0,0,0,0.78);
  border-bottom:3px solid #ff00ff;
  box-shadow:0 0 18px #ff00ff55;
  pointer-events:none; z-index:10;
  gap: 20px;
}
.hud-col { display:flex; flex-direction:column; gap:4px; }
.hud-col.center { align-items:center; flex:1; }
.hud-label {
  color:#aaa; font-size:10px; letter-spacing:2px; text-transform:uppercase;
}
.hud-value {
  color:#fff; font-size:18px; font-weight:bold;
  text-shadow:0 0 10px #ff00ff;
}
.hud-value.cyan  { text-shadow:0 0 10px #00ffff; color:#00ffff; }
.hud-value.yellow{ text-shadow:0 0 10px #ffff00; color:#ffff00; }
.hud-value.green { text-shadow:0 0 10px #00ff88; color:#00ff88; }

#timerBarWrap {
  width:220px; height:18px;
  background:#111; border:2px solid #ff00ff;
  border-radius:9px; overflow:hidden;
  box-shadow:0 0 8px #ff00ff44;
}
#timerBar {
  height:100%;
  background:linear-gradient(to right,#ff0000,#ffaa00,#ffff00);
  border-radius:7px;
  transition:width 0.1s linear;
}
#progressBarWrap {
  width:180px; height:14px;
  background:#111; border:2px solid #00ffff;
  border-radius:7px; overflow:hidden;
  box-shadow:0 0 8px #00ffff44;
}
#progressBar {
  height:100%;
  background:linear-gradient(to right,#00ff88,#00ffff);
  border-radius:5px;
  transition:width 0.1s;
}
#comboHud {
  font-size:22px; font-weight:bold;
  color:#ff0; text-shadow:0 0 14px #ff0;
  letter-spacing:2px;
  min-width:120px; text-align:center;
}

/* ── Roy ────────────────────────────────────────── */
#royWrap {
  position:fixed; bottom:110px; right:-200px;
  transition:right 0.25s cubic-bezier(.22,.68,0,1.2);
  z-index:20; pointer-events:none;
}
#royWrap.show { right:0; }
#royBubble {
  position:absolute; bottom:92px; right:165px;
  background:#fff; color:#000;
  padding:8px 12px; border-radius:12px;
  font-size:13px; font-weight:bold;
  max-width:175px; text-align:center;
  border:2px solid #000; line-height:1.3;
}
#royBubble::after {
  content:''; position:absolute;
  bottom:-11px; right:24px;
  border:6px solid transparent;
  border-top-color:#000;
}

/* ── Overlay ─────────────────────────────────────── */
#overlay {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  background:rgba(0,0,0,0.88);
  z-index:30; color:#fff;
}
#overlay h1 {
  font-size:clamp(28px,5vw,54px);
  color:#ff00ff; text-shadow:0 0 28px #ff00ff;
  letter-spacing:6px; margin-bottom:6px;
}
#overlay h2 {
  font-size:clamp(16px,2.5vw,26px);
  color:#00ffff; text-shadow:0 0 16px #00ffff;
  margin-bottom:22px;
}
#overlay p { font-size:14px; color:#ccc; margin:4px 0; }
#startBtn {
  margin-top:24px; padding:15px 50px;
  background:#ff00ff; color:#000;
  font-size:22px; font-weight:bold;
  font-family:'Courier New',monospace;
  border:none; cursor:pointer;
  letter-spacing:3px;
  box-shadow:0 0 28px #ff00ff;
  transition:all 0.1s;
}
#startBtn:hover { background:#fff; box-shadow:0 0 40px #fff; transform:scale(1.04); }
#scoreDisplay { font-size:32px; color:#ff0; text-shadow:0 0 18px #ff0; margin:12px 0; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="hud">
  <div class="hud-col">
    <div class="hud-label">Score</div>
    <div class="hud-value yellow" id="scoreHud">0</div>
    <div id="comboHud"></div>
  </div>

  <div class="hud-col center">
    <div class="hud-label">TIME REMAINING</div>
    <div id="timerBarWrap"><div id="timerBar" style="width:100%"></div></div>
    <div class="hud-value cyan" id="timerNum">30s</div>
  </div>

  <div class="hud-col" style="align-items:flex-end">
    <div class="hud-label">VIRUSES CRUSHED</div>
    <div id="progressBarWrap"><div id="progressBar" style="width:0%"></div></div>
    <div class="hud-value green" id="crushedHud">0 / 100</div>
    <div class="hud-value" id="speedHud" style="font-size:13px;color:#888">0 MPH</div>
  </div>
</div>

<div id="royWrap">
  <div id="royBubble">Nice job!</div>
  <canvas id="royCanvas" width="175" height="145"></canvas>
</div>

<div id="overlay">
  <h1>VIRUS CRUSHER</h1>
  <h2>A SANOFI ROAD TRIP</h2>
  <p>Drive your Ferrari and CRUSH 100 viruses to win!</p>
  <p>Each crush adds time &amp; earns points — chain them for COMBOS!</p>
  <p style="margin-top:14px;color:#ff0;font-size:16px">← → Arrow Keys or A / D to steer</p>
  <button id="startBtn" onclick="startGame()">INSERT COIN</button>
</div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const royCanvas = document.getElementById('royCanvas');
const royCtx  = royCanvas.getContext('2d');

const W = window.innerWidth;
const H = window.innerHeight;
canvas.width = W; canvas.height = H;

const HORIZON     = Math.round(H * 0.21);
const ROAD_BOTTOM = H - 2;
const ROAD_W_FAR  = Math.round(W * 0.13);
const ROAD_W_NEAR = Math.round(W * 0.95);
const CAR_Y       = H - 128;
const NUM_STRIPS  = 22;

// ─── State ───────────────────────────────────────────────────────────────────
let gameState = 'menu';
let score = 0, crushed = 0;
let timerFloat = 30, timer = 30;
const TIMER_MAX = 30;
let speed = 0, maxSpeed = 3;
let carX = W / 2, carSteer = 0;
let frameCount = 0, roadOffset = 0;
let viruses = [], particles = [], popups = [];
let royVisible = false, royTimer = 0;
let lastTime = 0;
let difficulty = 1;
let finishMode = false, finishProgress = 0;
let audioCtx = null;
let shake = 0;
let flashAlpha = 0;
let combo = 0, comboTimer = 0;
const COMBO_WINDOW = 150;

const ROY_PHRASES = [
  "NICE JOB!", "FLATTEN IT!", "SANOFI WINS!", "GET THAT VIRUS!",
  "BOOM! CRUSHED!", "SCIENCE WINS!", "AMAZING!", "KEEP ROLLING!",
  "THAT'S THE WAY!", "YEAH BABY!", "OBLITERATED!", "SQUISH IT!",
  "NO MERCY!", "MEDICINE RULES!", "THAT'S WHAT I LIKE!",
];
const MILESTONE_PHRASES = {
  10:  "10 CRUSHED! GREAT START!",
  25:  "QUARTER WAY! DON'T STOP!",
  50:  "HALFWAY! YOU'RE ON FIRE!",
  75:  "75! ALMOST LEGENDARY!",
  90:  "JUST 10 MORE! COME ON!",
  99:  "ONE MORE!! ONE MORE!!",
};

const VIRUS_TYPES = [
  { name:'FLU',     color:'#ff4444', size:40, spikes:8,  pts:10, glow:'#ff000088' },
  { name:'COVID',   color:'#ff8800', size:48, spikes:12, pts:20, glow:'#ff880088' },
  { name:'MEASLES', color:'#ff44ff', size:34, spikes:6,  pts:15, glow:'#ff00ff88' },
  { name:'POLIO',   color:'#4488ff', size:38, spikes:10, pts:25, glow:'#0044ff88' },
  { name:'EBOLA',   color:'#44ff66', size:44, spikes:7,  pts:30, glow:'#00ff4488' },
  { name:'RABIES',  color:'#ffff00', size:30, spikes:9,  pts:35, glow:'#ffff0088' },
];

// ─── Audio ────────────────────────────────────────────────────────────────────
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function note(freq, type, dur, vol=0.3, delay=0) {
  const ac = getAC(), o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, ac.currentTime+delay);
  g.gain.setValueAtTime(vol, ac.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+delay+dur);
  o.start(ac.currentTime+delay); o.stop(ac.currentTime+delay+dur);
}
function crunchSfx(comboLevel=0) {
  const boost = Math.min(comboLevel * 0.08, 0.3);
  note(80+comboLevel*15,'sawtooth',0.15,0.45+boost);
  note(120,'square',0.10,0.3+boost,0.05);
  note(55,'sawtooth',0.22,0.55+boost,0.11);
  if (comboLevel > 2) note(220,'square',0.18,0.25,0.06);
}
function engineSfx() {
  if (frameCount%5!==0) return;
  note(55+speed*28,'sawtooth',0.09,0.045);
}
let bgmHandle = null;
function startBGM() {
  const mel = [[523,0],[659,.18],[784,.36],[1047,.54],[784,.72],[659,.9],
    [523,1.08],[392,1.26],[440,1.44],[523,1.62],[659,1.8],[784,1.98],
    [880,2.16],[784,2.34],[1047,2.52],[880,2.7],[784,2.88],[523,3.06]];
  mel.forEach(([f,d])=>note(f,'square',0.17,0.11,d));
  bgmHandle = setTimeout(startBGM, 3400);
}
function stopBGM() { clearTimeout(bgmHandle); bgmHandle=null; }
function winSfx()  { [523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>note(f,'square',0.25,0.28,i*0.12)); }
function loseSfx() { [400,350,300,250,200,160].forEach((f,i)=>note(f,'sawtooth',0.3,0.28,i*0.2)); }

// ─── Perspective helpers ──────────────────────────────────────────────────────
function getPersp(z) {
  return {
    y: HORIZON + z*(ROAD_BOTTOM-HORIZON),
    sc: 0.1 + z*0.9
  };
}
function roadHW(z) {
  return ROAD_W_FAR/2 + (ROAD_W_NEAR/2 - ROAD_W_FAR/2)*z;
}
function roadCurve() {
  // Aggressive compound sine — big sweeping curves + sharp kinks
  return Math.sin(frameCount*0.007)*290 + Math.sin(frameCount*0.004)*140 + Math.sin(frameCount*0.0015)*80;
}
function roadCX(z) {
  // Road centre x at depth z
  return W/2 + roadCurve()*(1-z);
}
function virusScreenX(lane, z) {
  return roadCX(z) + lane*(roadHW(z)/1.5);
}

// ─── Sky ─────────────────────────────────────────────────────────────────────
// Pre-generate stable mountain peaks
const MTN1=[], MTN2=[];
for(let i=0;i<=40;i++){
  MTN1.push([i/40*W, HORIZON-(Math.abs(Math.sin(i*2.3+1.1))*HORIZON*0.55+HORIZON*0.08)]);
  MTN2.push([i/40*W, HORIZON-(Math.abs(Math.sin(i*1.7+2.4))*HORIZON*0.35+HORIZON*0.04)]);
}

function drawSky() {
  const g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,'#000028');
  g.addColorStop(0.45,'#150030');
  g.addColorStop(1,'#38004a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HORIZON);

  // Stars
  for(let i=0;i<130;i++){
    const sx=(i*179+frameCount*0.12)%W;
    const sy=(i*83)%HORIZON;
    const blink=Math.sin(frameCount*0.04+i*1.3)>0.72;
    ctx.fillStyle=blink?'#ffffc0':'#ffffff';
    ctx.fillRect(sx,sy,blink?2:1,blink?2:1);
  }

  // Sun
  const sx=W*0.5, sy=HORIZON-40, sr=Math.min(W,H)*0.055;
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*2.2);
  sg.addColorStop(0,'#ffffff'); sg.addColorStop(0.15,'#ff88ff');
  sg.addColorStop(0.5,'#ff00ff'); sg.addColorStop(1,'rgba(255,0,200,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.arc(sx,sy,sr*2.2,0,Math.PI*2); ctx.fill();
  // Sun stripes
  ctx.fillStyle='#38004a';
  for(let i=0;i<8;i++) ctx.fillRect(sx-sr,sy+sr*0.12+i*sr*0.18,sr*2,sr*0.10);

  // Mountains back
  ctx.fillStyle='#1a0036';
  ctx.beginPath(); ctx.moveTo(0,HORIZON);
  MTN1.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(W,HORIZON); ctx.closePath(); ctx.fill();
  // Mountains front
  ctx.fillStyle='#280050';
  ctx.beginPath(); ctx.moveTo(0,HORIZON);
  MTN2.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(W,HORIZON); ctx.closePath(); ctx.fill();
}

// ─── Road (scanline-style with colour bands + curve) ─────────────────────────
function drawRoad() {
  const cur = roadCurve();

  // Base grass
  const gg=ctx.createLinearGradient(0,HORIZON,0,ROAD_BOTTOM);
  gg.addColorStop(0,'#145514'); gg.addColorStop(1,'#1a7a1a');
  ctx.fillStyle=gg; ctx.fillRect(0,HORIZON,W,ROAD_BOTTOM-HORIZON);

  for(let i=NUM_STRIPS-1; i>=0; i--){
    const t0=i/NUM_STRIPS, t1=(i+1)/NUM_STRIPS;
    const y0=HORIZON+t0*(ROAD_BOTTOM-HORIZON);
    const y1=HORIZON+t1*(ROAD_BOTTOM-HORIZON);
    const cx0=W/2+cur*(1-t0), cx1=W/2+cur*(1-t1);
    const hw0=roadHW(t0), hw1=roadHW(t1);
    // Band alternation driven by scroll offset
    const band=Math.floor((i+roadOffset*NUM_STRIPS)%2<1?0:1);

    // Grass — NO alternation, solid; the perspective trapezoids alone give depth
    // (grass colour already filled by the base gradient rect above)

    // Road surface — very subtle alternation, low contrast
    ctx.fillStyle=band===0?'#2e2e48':'#282840';
    ctx.beginPath();
    ctx.moveTo(cx0-hw0,y0); ctx.lineTo(cx0+hw0,y0);
    ctx.lineTo(cx1+hw1,y1); ctx.lineTo(cx1-hw1,y1);
    ctx.fill();

    // Rumble strips — SOLID colour, thin, no alternation so they don't flash
    const rw0=hw0*0.038, rw1=hw1*0.038;
    ctx.fillStyle='#6a3000';
    // Left rumble
    ctx.beginPath();
    ctx.moveTo(cx0-hw0,y0); ctx.lineTo(cx0-hw0+rw0,y0);
    ctx.lineTo(cx1-hw1+rw1,y1); ctx.lineTo(cx1-hw1,y1); ctx.fill();
    // Right rumble
    ctx.beginPath();
    ctx.moveTo(cx0+hw0-rw0,y0); ctx.lineTo(cx0+hw0,y0);
    ctx.lineTo(cx1+hw1,y1); ctx.lineTo(cx1+hw1-rw1,y1); ctx.fill();

    // Lane dividers (white dashes, only on band 0)
    if(band===0){
      ctx.fillStyle='#ffffff';
      const lo0=hw0/1.5, lo1=hw1/1.5;
      const mw0=Math.max(1,hw0*0.022), mw1=Math.max(1,hw1*0.022);
      for(const s of[-1,1]){
        ctx.beginPath();
        ctx.moveTo(cx0+s*lo0-mw0,y0); ctx.lineTo(cx0+s*lo0+mw0,y0);
        ctx.lineTo(cx1+s*lo1+mw1,y1); ctx.lineTo(cx1+s*lo1-mw1,y1);
        ctx.fill();
      }
    }
  }

  // Edge lines
  const cxT=W/2+cur, cxB=W/2;
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cxT-ROAD_W_FAR/2,HORIZON); ctx.lineTo(cxB-ROAD_W_NEAR/2,ROAD_BOTTOM); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxT+ROAD_W_FAR/2,HORIZON); ctx.lineTo(cxB+ROAD_W_NEAR/2,ROAD_BOTTOM); ctx.stroke();

  if(finishMode) drawFinishLine();
}

// ─── Telephone poles ─────────────────────────────────────────────────────────
function drawPoles() {
  const cur=roadCurve();
  const n=10;
  for(let i=0;i<n;i++){
    const raw=(i/n+roadOffset*0.55)%1;
    if(raw<0.06) continue;
    const p=getPersp(raw);
    const cx=W/2+cur*(1-raw);
    const hw=roadHW(raw);
    const ph=100*p.sc, pw=Math.max(2,6*p.sc), cw=Math.max(3,22*p.sc), ch=Math.max(1,3*p.sc);
    ctx.fillStyle='#7a7a8a';
    for(const side of[-1,1]){
      const px=cx+side*(hw+18*p.sc);
      ctx.fillRect(px-pw/2, p.y-ph, pw, ph);
      ctx.fillStyle='#555566';
      ctx.fillRect(px-cw/2, p.y-ph+ch, cw, ch);
      ctx.fillStyle='#7a7a8a';
    }
  }
}

function drawFinishLine() {
  const t=Math.min(0.97, 0.2+finishProgress*0.65);
  const p=getPersp(t), cx=roadCX(t), hw=roadHW(t);
  const y=p.y, h=Math.max(6,11*p.sc), sq=10, sqW=(hw*2)/sq;
  for(let i=0;i<sq;i++){
    ctx.fillStyle=(i%2===0)?'#fff':'#000';
    ctx.fillRect(cx-hw+i*sqW, y-h, sqW, h);
    ctx.fillStyle=(i%2===1)?'#fff':'#000';
    ctx.fillRect(cx-hw+i*sqW, y,   sqW, h);
  }
}

// ─── Virus ───────────────────────────────────────────────────────────────────
function drawVirus(v) {
  const p  = getPersp(v.z);
  const sx = virusScreenX(v.lane, v.z);
  const sy = p.y;
  const s  = p.sc * v.type.size;

  if(v.crushed){
    // Squished flat splat
    const fade = v.z>0.92 ? Math.max(0, 1-(v.z-0.92)/0.18) : 1;
    if(fade<=0) return;
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1.75, 0.18);
    // Body
    ctx.shadowColor = v.type.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0,0,s*1.35,0,Math.PI*2);
    ctx.fillStyle=v.type.color+'bb'; ctx.fill();
    ctx.strokeStyle=v.type.color; ctx.lineWidth=2; ctx.stroke();
    ctx.shadowBlur=0;
    // Squashed spikes
    for(let i=0;i<v.type.spikes;i++){
      const a=(i/v.type.spikes)*Math.PI*2;
      const tip=s*2.0+6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*s*1.1, Math.sin(a)*s*1.1);
      ctx.lineTo(Math.cos(a)*tip,   Math.sin(a)*tip);
      ctx.strokeStyle=v.type.color; ctx.lineWidth=3; ctx.stroke();
      ctx.beginPath(); ctx.arc(Math.cos(a)*tip,Math.sin(a)*tip,3,0,Math.PI*2);
      ctx.fillStyle=v.type.color; ctx.fill();
    }
    // X eyes
    ctx.strokeStyle='#000'; ctx.lineWidth=Math.max(1.5,2.5*p.sc);
    const ex=s*0.32, es=s*0.22;
    for(const sd of[-1,1]){
      const ox=sd*ex;
      ctx.beginPath(); ctx.moveTo(ox-es,-es); ctx.lineTo(ox+es,es); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox+es,-es); ctx.lineTo(ox-es,es); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
    // Label outside squash
    if(fade>0.3){
      ctx.globalAlpha=fade;
      ctx.fillStyle='#fff';
      ctx.font=`bold ${Math.max(7,11*p.sc)}px Courier New`;
      ctx.textAlign='center';
      ctx.fillText('\u2605 '+v.type.name+' \u2605', sx, sy+s*0.4+13*p.sc);
      ctx.globalAlpha=1;
    }
    return;
  }

  // Living virus
  const pulse = 1 + 0.07*Math.sin(frameCount*0.14+v.lane+v.z*8);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(v.rot);
  ctx.scale(pulse, pulse);

  // Road shadow
  ctx.save(); ctx.scale(1,0.25);
  ctx.beginPath(); ctx.arc(0,s*4,s*0.85,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fill();
  ctx.restore();

  // Glow
  ctx.shadowColor=v.type.color; ctx.shadowBlur=18*p.sc;
  ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2);
  ctx.fillStyle=v.type.color; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.shadowBlur=0;

  // Spikes
  for(let i=0;i<v.type.spikes;i++){
    const a=(i/v.type.spikes)*Math.PI*2;
    const tip=s+8*p.sc;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s,    Math.sin(a)*s);
    ctx.lineTo(Math.cos(a)*tip,  Math.sin(a)*tip);
    ctx.strokeStyle=v.type.color; ctx.lineWidth=2.5*p.sc; ctx.stroke();
    ctx.beginPath(); ctx.arc(Math.cos(a)*tip,Math.sin(a)*tip,2.8*p.sc,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
  }

  // Face
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(-s*0.28,-s*0.2,s*0.17,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.28,-s*0.2,s*0.17,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,s*0.12,s*0.3,0,Math.PI);
  ctx.strokeStyle='#000'; ctx.lineWidth=1.8; ctx.stroke();

  ctx.restore();

  // Label
  ctx.fillStyle='#fff';
  ctx.font=`bold ${Math.max(8,11*p.sc)}px Courier New`;
  ctx.textAlign='center';
  ctx.shadowColor=v.type.color; ctx.shadowBlur=8;
  ctx.fillText(v.type.name, sx, sy+s*pulse+13*p.sc);
  ctx.shadowBlur=0;
}

// ─── Car ─────────────────────────────────────────────────────────────────────
function drawCar() {
  ctx.save();
  ctx.translate(carX, CAR_Y);
  ctx.rotate(carSteer*0.09);

  // Shadow
  ctx.beginPath(); ctx.ellipse(0,53,74,17,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fill();

  // Body silhouette (rear toward player = bottom, front toward horizon = top)
  ctx.beginPath();
  ctx.moveTo(-60, 44);  // rear-left
  ctx.lineTo( 60, 44);  // rear-right
  ctx.lineTo( 54,  5);
  ctx.lineTo( 40,-48);
  ctx.lineTo(-40,-48);
  ctx.lineTo(-54,  5);
  ctx.closePath();
  ctx.fillStyle='#cc0000'; ctx.fill();
  ctx.strokeStyle='#880000'; ctx.lineWidth=1.5; ctx.stroke();

  // Roof
  ctx.beginPath();
  ctx.moveTo(-28,25); ctx.lineTo(28,25);
  ctx.lineTo(22,-28); ctx.lineTo(-22,-28);
  ctx.closePath();
  ctx.fillStyle='#991100'; ctx.fill();

  // Rear window
  ctx.beginPath();
  ctx.moveTo(-21,22); ctx.lineTo(21,22);
  ctx.lineTo(15,-3);  ctx.lineTo(-15,-3);
  ctx.closePath();
  ctx.fillStyle='rgba(80,160,255,0.68)'; ctx.fill();
  ctx.strokeStyle='rgba(160,215,255,0.45)'; ctx.lineWidth=1; ctx.stroke();

  // Front windshield (smaller, far away)
  ctx.beginPath();
  ctx.moveTo(-14,-28); ctx.lineTo(14,-28);
  ctx.lineTo(10,-44);  ctx.lineTo(-10,-44);
  ctx.closePath();
  ctx.fillStyle='rgba(80,160,255,0.58)'; ctx.fill();

  // Side stripes
  ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-53,40); ctx.lineTo(-47,-44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 53,40); ctx.lineTo( 47,-44); ctx.stroke();

  // Rear bumper
  ctx.beginPath();
  ctx.moveTo(-60,42); ctx.lineTo(60,42);
  ctx.lineTo(57,52);  ctx.lineTo(-57,52);
  ctx.closePath(); ctx.fillStyle='#770000'; ctx.fill();

  // Taillights — glowing
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=18;
  ctx.fillStyle='#ff2200';
  ctx.fillRect(-58,27,25,13); ctx.fillRect(33,27,25,13);
  ctx.fillStyle='#ff7700';
  ctx.fillRect(-11,29,22,9);
  ctx.shadowBlur=0;

  // License plate
  ctx.fillStyle='#fff'; ctx.fillRect(-25,42,50,13);
  ctx.fillStyle='#0000aa';
  ctx.font='bold 9px Courier New'; ctx.textAlign='center';
  ctx.fillText('SANOFI',0,53);

  // Rear wheels
  for(const wx of[-66,66]){
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(wx,34,18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(wx,34,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(wx,34, 5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#777'; ctx.lineWidth=1.5;
    for(let s=0;s<5;s++){
      const a=(s/5)*Math.PI*2+frameCount*0.22;
      ctx.beginPath();
      ctx.moveTo(wx+Math.cos(a)*3,  34+Math.sin(a)*3);
      ctx.lineTo(wx+Math.cos(a)*11, 34+Math.sin(a)*11);
      ctx.stroke();
    }
  }
  // Front wheels
  for(const wx of[-43,43]){
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(wx,-40,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(wx,-40, 7,0,Math.PI*2); ctx.fill();
  }

  // Prancing horse
  ctx.font='15px serif'; ctx.textAlign='center'; ctx.fillText('\uD83D\uDC0E',0,-18);

  // Headlights
  ctx.shadowColor='#ffffaa'; ctx.shadowBlur=10;
  ctx.fillStyle='#ffffcc';
  ctx.fillRect(-38,-50,14,6); ctx.fillRect(24,-50,14,6);
  ctx.shadowBlur=0;

  // Exhaust
  if(speed>0.8){
    for(const[ex,ey]of[[-50,50],[50,50]]){
      particles.push({
        x:carX+ex+(Math.random()-.5)*5,
        y:CAR_Y+ey,
        vx:(Math.random()-.5)*1.5,
        vy:speed*2+Math.random()*2,
        life:28, maxLife:28,
        color:`hsl(${15+Math.random()*18},60%,${48+Math.random()*22}%)`
      });
    }
  }

  ctx.restore();
}

// ─── Particles ───────────────────────────────────────────────────────────────
function drawParticles() {
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.life--;
    const a=p.life/p.maxLife;
    ctx.beginPath(); ctx.arc(p.x,p.y,4.5*a,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.globalAlpha=a; ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ─── Floating text popups ─────────────────────────────────────────────────────
function drawPopups() {
  popups=popups.filter(p=>p.life>0);
  for(const p of popups){
    p.y-=1.8; p.life--;
    const a=p.life<25?p.life/25:1;
    ctx.globalAlpha=a;
    ctx.font=`bold ${p.sz}px Courier New`;
    ctx.textAlign='center';
    ctx.fillStyle='#000';
    ctx.fillText(p.text, p.x+2, p.y+2);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=12;
    ctx.fillText(p.text, p.x, p.y);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}

function addPopup(text,x,y,color,sz){
  popups.push({text,x,y,color,sz:sz||18,life:80,maxLife:80});
}

// ─── Roy ─────────────────────────────────────────────────────────────────────
function drawRoy() {
  const rc=royCtx;
  rc.clearRect(0,0,175,145);
  // Head
  rc.beginPath(); rc.arc(87,62,34,0,Math.PI*2);
  rc.fillStyle='#f5c5a0'; rc.fill();
  rc.strokeStyle='#cc9966'; rc.lineWidth=2; rc.stroke();
  // Hair
  rc.fillStyle='#553300'; rc.beginPath(); rc.arc(87,34,34,Math.PI,Math.PI*2); rc.fill();
  // Eyes — wide & excited
  for(const[ex,ox]of[[70,71],[104,105]]){
    rc.fillStyle='#fff'; rc.beginPath(); rc.arc(ex,57,9,0,Math.PI*2); rc.fill();
    rc.fillStyle='#1a1000'; rc.beginPath(); rc.arc(ox,58,5,0,Math.PI*2); rc.fill();
    rc.fillStyle='#fff'; rc.beginPath(); rc.arc(ox+1,57,2,0,Math.PI*2); rc.fill();
  }
  // Eyebrows raised
  rc.strokeStyle='#553300'; rc.lineWidth=3.5;
  rc.beginPath(); rc.moveTo(61,46); rc.quadraticCurveTo(70,41,79,46); rc.stroke();
  rc.beginPath(); rc.moveTo(94,46); rc.quadraticCurveTo(103,41,112,46); rc.stroke();
  // Huge smile
  rc.beginPath(); rc.arc(87,65,22,0.08,Math.PI-0.08);
  rc.strokeStyle='#cc2200'; rc.lineWidth=4; rc.stroke();
  rc.fillStyle='#fff'; rc.fillRect(70,73,34,9);
  rc.strokeStyle='#ddd'; rc.lineWidth=1;
  for(let i=1;i<5;i++) rc.strokeRect(70+i*6.8,73,6.8,9);
  // Neck + coat
  rc.fillStyle='#f5c5a0'; rc.fillRect(76,94,22,15);
  rc.fillStyle='#fff'; rc.fillRect(47,107,80,38); rc.strokeStyle='#ddd'; rc.lineWidth=1; rc.strokeRect(47,107,80,38);
  // Collar
  rc.fillStyle='#fff';
  rc.beginPath(); rc.moveTo(76,109); rc.lineTo(56,122); rc.lineTo(87,118); rc.closePath(); rc.fill();
  rc.beginPath(); rc.moveTo(98,109); rc.lineTo(118,122); rc.lineTo(87,118); rc.closePath(); rc.fill();
  rc.fillStyle='#0044aa'; rc.font='bold 9px Courier New'; rc.textAlign='center';
  rc.fillText('SANOFI',87,127);
  // Waving arm
  const wave=Math.sin(frameCount*0.24)*24;
  rc.save(); rc.translate(47,112);
  rc.rotate((-0.55+wave/100)*Math.PI);
  rc.fillStyle='#fff'; rc.fillRect(-6,0,13,30);
  rc.fillStyle='#f5c5a0'; rc.beginPath(); rc.arc(0,33,10,0,Math.PI*2); rc.fill();
  rc.restore();
}

function showRoy(phrase) {
  royVisible=true; royTimer=210;
  document.getElementById('royBubble').textContent=phrase;
  document.getElementById('royWrap').classList.add('show');
}
function hideRoy() {
  royVisible=false;
  document.getElementById('royWrap').classList.remove('show');
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(gameState==='menu'&&(e.key===' '||e.key==='Enter'))startGame(); });
document.addEventListener('keyup',  e=>{ keys[e.key]=false; });

// ─── Spawn ────────────────────────────────────────────────────────────────────
function spawnVirus() {
  const lane=[-1,0,1][Math.floor(Math.random()*3)];
  const type=VIRUS_TYPES[Math.floor(Math.random()*VIRUS_TYPES.length)];
  viruses.push({lane,z:0.01,type,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*0.055,crushed:false,crushedTimer:0});
}

// ─── Game lifecycle ───────────────────────────────────────────────────────────
function startGame(){
  getAC(); stopBGM();
  gameState='playing';
  score=0; crushed=0; timerFloat=30; timer=30;
  speed=0; maxSpeed=3.5; carX=W/2; carSteer=0;
  frameCount=0; roadOffset=0;
  viruses=[]; particles=[]; popups=[];
  finishMode=false; finishProgress=0; difficulty=1;
  royVisible=false; combo=0; comboTimer=0;
  shake=0; flashAlpha=0;
  document.getElementById('overlay').style.display='none';
  hideRoy();
  startBGM();
  lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

function endGame(win){
  gameState=win?'win':'gameover';
  stopBGM();
  const ol=document.getElementById('overlay');
  ol.style.display='flex';
  ol.innerHTML=win
    ?`<h1>YOU WIN!</h1><h2>100 VIRUSES CRUSHED!</h2><div id="scoreDisplay">SCORE: ${score}</div><p style="color:#0f0;font-size:18px;margin:8px 0">SANOFI SAVES THE DAY!</p><p>Roy is EXTREMELY proud of you.</p><button id="startBtn" onclick="startGame()">PLAY AGAIN</button>`
    :`<h1>GAME OVER</h1><h2>THE VIRUSES WIN... FOR NOW</h2><div id="scoreDisplay">SCORE: ${score}</div><p>Crushed: ${crushed}/100 — So close!</p><button id="startBtn" onclick="startGame()">TRY AGAIN</button>`;
  win?winSfx():loseSfx();
}

// ─── Collision ───────────────────────────────────────────────────────────────
let lastSpawn=0;

function checkCollisions(){
  const cHW=62; // car half-width in pixels
  for(const v of viruses){
    if(v.crushed||v.z<0.72||v.z>1.01) continue;
    const vx=virusScreenX(v.lane,v.z);
    const p=getPersp(v.z);
    // Collision only when car physically overlaps virus — use actual pixel radius
    const virusR=p.sc*v.type.size*1.2;
    if(Math.abs(vx-carX) > cHW+virusR) continue;

    v.crushed=true; v.crushedTimer=170;
    crushed++;

    // Combo
    comboTimer=COMBO_WINDOW;
    combo++;
    const comboMult=1+Math.min(combo-1,8)*0.5;
    const pts=Math.round(v.type.pts*difficulty*comboMult);
    score+=pts;

    // Timer bonus (combos give more time)
    const tBonus=2.5+Math.min(combo-1,5)*0.5;
    timerFloat=Math.min(timerFloat+tBonus, 45);
    timer=Math.ceil(timerFloat);

    // Feedback
    shake=Math.min(14, 5+combo*1.5);
    flashAlpha=0.45;
    crunchSfx(combo-1);

    // Crush particles
    for(let i=0;i<22;i++){
      particles.push({
        x:vx, y:p.y,
        vx:(Math.random()-.5)*12, vy:(Math.random()-.5)*12-3,
        life:55, maxLife:55, color:v.type.color
      });
    }

    // Score popup
    addPopup(combo>1?`x${combo} COMBO! +${pts}`:'+'+pts, vx, p.y-30,
      combo>1?'#ffff00':'#ffffff', combo>1?Math.min(36,20+combo*3):18);
    // Time popup
    addPopup(`+${tBonus.toFixed(1)}s`, W/2+(Math.random()-.5)*80, H*0.38,'#00ff88',20);

    // Milestone Roy message
    const mil=MILESTONE_PHRASES[crushed];
    showRoy(mil||ROY_PHRASES[Math.floor(Math.random()*ROY_PHRASES.length)]);

    if(crushed>=100){ finishMode=true; finishProgress=0; }
  }
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function gameLoop(ts){
  if(gameState!=='playing') return;
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts; frameCount++;

  // Difficulty
  difficulty=1+crushed*0.022;
  maxSpeed=3.5+difficulty*0.45;
  speed=Math.min(maxSpeed, speed+0.045);

  // Steering + lean
  const steerSpeed=5+speed*0.5;
  const lft=keys['ArrowLeft']||keys['a']||keys['A'];
  const rgt=keys['ArrowRight']||keys['d']||keys['D'];
  if(lft) carX=Math.max(W/2-ROAD_W_NEAR/2+72,carX-steerSpeed);
  if(rgt) carX=Math.min(W/2+ROAD_W_NEAR/2-72,carX+steerSpeed);
  carSteer+=(( rgt?1:lft?-1:0)-carSteer)*0.13;

  // Road-curve drift — sharper curves push the car; player must counter-steer
  const cur=roadCurve();
  carX+=cur*0.016*speed*0.1;
  carX=Math.max(W/2-ROAD_W_NEAR/2+72, Math.min(W/2+ROAD_W_NEAR/2-72, carX));

  roadOffset=(roadOffset+speed*0.018)%1;

  // Viruses
  viruses.forEach(v=>{
    if(!v.crushed){ v.z+=speed*0.0042; v.rot+=v.rotSpeed; }
    else v.crushedTimer--;
  });
  viruses=viruses.filter(v=>v.z<1.22&&(!v.crushed||v.crushedTimer>0));

  // Spawn
  const interval=Math.max(36,100-difficulty*14);
  if(frameCount-lastSpawn>interval){ spawnVirus(); lastSpawn=frameCount; }

  checkCollisions();

  // Finish line
  if(finishMode){ finishProgress+=speed*0.009; if(finishProgress>=1){endGame(true);return;} }

  // Timer
  timerFloat-=dt;
  timer=Math.max(0,Math.ceil(timerFloat));
  if(timerFloat<=0&&!finishMode){endGame(false);return;}

  // Combo decay
  if(comboTimer>0){ comboTimer--; } else if(combo>0){ combo=0; }

  // Screen shake decay
  shake*=0.75;

  // Flash decay
  flashAlpha=Math.max(0, flashAlpha-0.06);

  // Roy timer
  if(royVisible&&--royTimer<=0) hideRoy();

  engineSfx();

  // ─ Apply shake ─
  ctx.save();
  if(shake>0.4) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  // ─ Draw ─
  ctx.clearRect(-20,-20,W+40,H+40);
  drawSky();
  drawRoad();
  drawPoles();

  [...viruses].sort((a,b)=>a.z-b.z).forEach(drawVirus);
  drawParticles();
  drawCar();
  drawPopups();

  // Speed lines
  if(speed>2.8){
    const alpha=(speed-2.8)*0.055;
    ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
    ctx.lineWidth=1;
    for(let i=0;i<12;i++){
      const lx=W/2-ROAD_W_NEAR/2+Math.random()*ROAD_W_NEAR;
      ctx.beginPath();
      ctx.moveTo(lx, H-90-Math.random()*50);
      ctx.lineTo(lx+(lx-W/2)*0.10, H-190-Math.random()*60);
      ctx.stroke();
    }
  }

  // Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  // Low-timer flash
  if(timer<=5&&!finishMode){
    ctx.fillStyle=`rgba(255,0,0,${0.14*Math.abs(Math.sin(frameCount*0.28))})`;
    ctx.fillRect(0,0,W,H);
  }

  // White crush flash (on top of everything)
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore(); // end shake

  // ─ HUD updates ─
  document.getElementById('scoreHud').textContent = score.toLocaleString();
  document.getElementById('speedHud').textContent = Math.round(speed*32)+' MPH';
  document.getElementById('crushedHud').textContent = crushed+' / 100';
  document.getElementById('timerNum').textContent = timer+'s';
  document.getElementById('timerBar').style.width = Math.max(0,(timerFloat/TIMER_MAX)*100)+'%';
  document.getElementById('progressBar').style.width = (crushed/100*100)+'%';
  const cd=document.getElementById('comboHud');
  if(combo>1&&comboTimer>0){
    cd.textContent=`x${combo} COMBO!`;
    cd.style.fontSize=Math.min(26,16+combo*2)+'px';
    cd.style.opacity=comboTimer<30?(comboTimer/30).toFixed(2):'1';
  } else {
    cd.textContent='';
  }

  drawRoy();
  requestAnimationFrame(gameLoop);
}

drawRoy();
</script>
