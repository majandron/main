<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS CRUSHER - A Sanofi Road Trip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: 'Courier New', monospace; overflow: hidden; }
  #gameContainer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    z-index: 10;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(0,0,0,0.75);
    border-bottom: 2px solid #ff00ff;
  }
  .hud-item {
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 0 8px #ff00ff;
  }
  .hud-item span { color: #ff00ff; }
  #royContainer {
    position: fixed;
    bottom: 110px;
    right: -175px;
    transition: right 0.3s ease;
    z-index: 20;
    pointer-events: none;
  }
  #royContainer.visible { right: 0; }
  #royBubble {
    position: absolute;
    bottom: 85px;
    right: 150px;
    background: #fff;
    color: #000;
    padding: 7px 11px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
    max-width: 170px;
    text-align: center;
    border: 2px solid #000;
    white-space: normal;
  }
  #royBubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    right: 22px;
    border: 5px solid transparent;
    border-top-color: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.87);
    z-index: 30;
    color: #fff;
  }
  #overlay h1 {
    font-size: 42px;
    color: #ff00ff;
    text-shadow: 0 0 22px #ff00ff;
    margin-bottom: 8px;
    letter-spacing: 5px;
  }
  #overlay h2 {
    font-size: 24px;
    color: #00ffff;
    text-shadow: 0 0 14px #00ffff;
    margin-bottom: 22px;
  }
  #overlay p { font-size: 14px; color: #aaa; margin: 4px 0; }
  #startBtn {
    margin-top: 22px;
    padding: 14px 44px;
    background: #ff00ff;
    color: #000;
    font-size: 20px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    border: none;
    cursor: pointer;
    letter-spacing: 3px;
    box-shadow: 0 0 22px #ff00ff;
    transition: all 0.1s;
  }
  #startBtn:hover { background: #fff; box-shadow: 0 0 34px #fff; }
  #scoreDisplay {
    font-size: 30px;
    color: #ff0;
    text-shadow: 0 0 16px #ff0;
    margin: 12px 0;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hud-item">SCORE: <span id="scoreHud">0</span></div>
      <div class="hud-item">CRUSHED: <span id="crushedHud">0</span>/100</div>
      <div class="hud-item">SPEED: <span id="speedHud">0</span> MPH</div>
      <div class="hud-item">TIME: <span id="timerHud">30</span>s</div>
    </div>
  </div>
  <div id="royContainer">
    <div id="royBubble">Nice job!</div>
    <canvas id="royCanvas" width="160" height="130"></canvas>
  </div>
  <div id="overlay">
    <h1>VIRUS CRUSHER</h1>
    <h2>A SANOFI ROAD TRIP</h2>
    <p>Drive your Ferrari and CRUSH viruses!</p>
    <p>Each crush adds time. Flatten 100 to WIN!</p>
    <p style="margin-top:12px;color:#ff0">&#8592; &#8594; Arrow Keys or A/D to steer</p>
    <button id="startBtn" onclick="startGame()">INSERT COIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const royCanvas = document.getElementById('royCanvas');
const royCtx = royCanvas.getContext('2d');

// Full-screen dimensions
const W = window.innerWidth;
const H = window.innerHeight;
canvas.width = W;
canvas.height = H;

// Road config — low horizon = lots of road visible
const HORIZON    = Math.round(H * 0.20);
const ROAD_BOTTOM = H - 5;
const ROAD_W_FAR  = Math.round(W * 0.14);
const ROAD_W_NEAR = Math.round(W * 0.92);
const CAR_Y = H - 130;  // car center y

let gameState = 'menu';
let score = 0;
let crushed = 0;
let timer = 30;
let timerFloat = 30;
let speed = 0;
let maxSpeed = 3;
let carX = W / 2;
let carSteer = 0;  // visual tilt
let frameCount = 0;
let roadOffset = 0;
let viruses = [];
let particles = [];
let royVisible = false;
let royTimer = 0;
let lastTime = 0;
let difficulty = 1;
let finishMode = false;
let finishProgress = 0;
let audioCtx = null;

const ROY_PHRASES = [
  "NICE JOB!", "FLATTEN IT!", "SANOFI WINS!", "GET THAT VIRUS!",
  "BOOM! CRUSHED!", "ROY APPROVES!", "SCIENCE WINS!", "AMAZING!",
  "KEEP ROLLING!", "THAT'S THE WAY!", "YEAH BABY!", "OBLITERATED!",
  "SQUISH IT!", "ONE MORE DOWN!", "MEDICINE WINS!"
];

const VIRUS_TYPES = [
  { name: 'FLU',     color: '#ff4444', size: 22, spikes: 8,  pts: 10 },
  { name: 'COVID',   color: '#ff8800', size: 26, spikes: 12, pts: 20 },
  { name: 'MEASLES', color: '#ff44ff', size: 18, spikes: 6,  pts: 15 },
  { name: 'POLIO',   color: '#4488ff', size: 20, spikes: 10, pts: 25 },
  { name: 'EBOLA',   color: '#44ff66', size: 24, spikes: 7,  pts: 30 },
  { name: 'RABIES',  color: '#ffff00', size: 16, spikes: 9,  pts: 35 },
];

// ─── Audio ──────────────────────────────────────────────────────────────────
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playNote(freq, type, duration, vol = 0.3, delay = 0) {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime + delay);
  gain.gain.setValueAtTime(vol, ac.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + duration);
  osc.start(ac.currentTime + delay);
  osc.stop(ac.currentTime + delay + duration);
}
function playCrunchSound() {
  playNote(80,  'sawtooth', 0.15, 0.4);
  playNote(120, 'square',   0.10, 0.3, 0.05);
  playNote(60,  'sawtooth', 0.20, 0.5, 0.10);
}
function playEngineNote() {
  if (frameCount % 4 !== 0) return;
  playNote(60 + speed * 30, 'sawtooth', 0.08, 0.05);
}
let bgmTimeout = null;
function playBGM() {
  const melody = [
    [523,0],[659,.2],[784,.4],[1047,.6],[784,.8],[659,1.0],
    [523,1.2],[392,1.4],[440,1.6],[523,1.8],[659,2.0],[784,2.2],
    [880,2.4],[784,2.6],[659,2.8],[523,3.0]
  ];
  melody.forEach(([f,d]) => playNote(f, 'square', 0.18, 0.12, d));
  bgmTimeout = setTimeout(playBGM, 3500);
}
function stopBGM() { clearTimeout(bgmTimeout); bgmTimeout = null; }
function playWinSound() {
  [523,659,784,1047,784,1047,1319].forEach((f,i) => playNote(f,'square',0.3,0.3,i*0.15));
}
function playGameOverSound() {
  [400,350,300,250,200,150].forEach((f,i) => playNote(f,'sawtooth',0.3,0.3,i*0.2));
}

// ─── Perspective helpers ─────────────────────────────────────────────────────
function getPerspective(z) {
  return {
    screenY: HORIZON + z * (ROAD_BOTTOM - HORIZON),
    scale: 0.12 + z * 0.88
  };
}
function getRoadHalfW(z) {
  return ROAD_W_FAR/2 + (ROAD_W_NEAR/2 - ROAD_W_FAR/2) * z;
}
function getVirusScreenX(lane, z) {
  return W/2 + lane * (getRoadHalfW(z) / 1.5);
}

// ─── Sky & scenery ───────────────────────────────────────────────────────────
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, HORIZON);
  grad.addColorStop(0,   '#000033');
  grad.addColorStop(0.5, '#110022');
  grad.addColorStop(1,   '#330044');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HORIZON);

  // Stars
  for (let i = 0; i < 120; i++) {
    const sx = (i * 173 + frameCount * 0.15) % W;
    const sy = (i * 97) % HORIZON;
    const blink = Math.sin(frameCount * 0.05 + i) > 0.7;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, sy, blink ? 2 : 1, blink ? 2 : 1);
  }

  // Sun
  const sunX = W * 0.5;
  const sunY = HORIZON - 38;
  const r = Math.min(W, H) * 0.065;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r * 1.6);
  sg.addColorStop(0,   '#ff00ff');
  sg.addColorStop(0.5, '#ff4488');
  sg.addColorStop(1,   'rgba(255,0,255,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(sunX, sunY, r * 1.6, 0, Math.PI * 2);
  ctx.fill();
  // Stripes over sun
  ctx.fillStyle = '#000033';
  for (let i = 0; i < 7; i++) ctx.fillRect(sunX - r, sunY + r * 0.18 + i * r * 0.23, r * 2, r * 0.12);

  // Palm silhouettes
  const palms = [
    [W*0.06, HORIZON, 0.5], [W*0.12, HORIZON, 0.7], [W*0.88, HORIZON, 0.6],
    [W*0.94, HORIZON, 0.45], [W*0.02, HORIZON, 0.35]
  ];
  palms.forEach(([px, py, sc]) => drawPalmTree(px, py, sc));
}

function drawPalmTree(x, baseY, sc) {
  ctx.fillStyle = '#110022';
  ctx.fillRect(x - 4*sc, baseY - 70*sc, 8*sc, 70*sc);
  ctx.strokeStyle = '#110022';
  for (let a = 0; a < 6; a++) {
    const angle = (a/6) * Math.PI - Math.PI/2 + Math.sin(frameCount*0.02)*0.08;
    ctx.beginPath();
    ctx.moveTo(x, baseY - 70*sc);
    ctx.lineTo(x + Math.cos(angle)*38*sc, baseY - 70*sc + Math.sin(angle)*22*sc);
    ctx.lineWidth = 5*sc;
    ctx.stroke();
  }
}

// ─── Road ────────────────────────────────────────────────────────────────────
function drawRoad() {
  // Dirt / shoulder
  ctx.fillStyle = '#1a0a2e';
  ctx.fillRect(0, HORIZON, W, ROAD_BOTTOM - HORIZON);

  // Road surface
  const rg = ctx.createLinearGradient(0, HORIZON, 0, ROAD_BOTTOM);
  rg.addColorStop(0, '#282838');
  rg.addColorStop(1, '#1a1a2a');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(W/2 - ROAD_W_FAR/2, HORIZON);
  ctx.lineTo(W/2 + ROAD_W_FAR/2, HORIZON);
  ctx.lineTo(W/2 + ROAD_W_NEAR/2, ROAD_BOTTOM);
  ctx.lineTo(W/2 - ROAD_W_NEAR/2, ROAD_BOTTOM);
  ctx.closePath();
  ctx.fill();

  // Dashed lane markings (centre & side lanes)
  const stripeCount = 14;
  for (let i = 0; i < stripeCount; i++) {
    const t0 = ((i / stripeCount) + roadOffset) % 1;
    const t1 = (((i + 0.38) / stripeCount) + roadOffset) % 1;
    if (t0 > t1) continue;
    const p0 = getPerspective(t0), p1 = getPerspective(t1);
    // Two divider lines (1/3 and 2/3 of road width from centre)
    for (const frac of [-1, 1]) {
      const x0 = W/2 + frac * (ROAD_W_FAR/2 + (ROAD_W_NEAR/2 - ROAD_W_FAR/2)*t0) * (2/3);
      const x1 = W/2 + frac * (ROAD_W_FAR/2 + (ROAD_W_NEAR/2 - ROAD_W_FAR/2)*t1) * (2/3);
      ctx.beginPath();
      ctx.moveTo(x0, p0.screenY);
      ctx.lineTo(x1, p1.screenY);
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = Math.max(1, 2 * p0.scale);
      ctx.stroke();
    }
  }

  // Road edges
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2 - ROAD_W_FAR/2, HORIZON);
  ctx.lineTo(W/2 - ROAD_W_NEAR/2, ROAD_BOTTOM);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W/2 + ROAD_W_FAR/2, HORIZON);
  ctx.lineTo(W/2 + ROAD_W_NEAR/2, ROAD_BOTTOM);
  ctx.stroke();

  if (finishMode) drawFinishLine();
}

function drawFinishLine() {
  const t = Math.min(0.98, 0.25 + finishProgress * 0.6);
  const p = getPerspective(t);
  const lx = W/2 - getRoadHalfW(t);
  const rx = W/2 + getRoadHalfW(t);
  const y  = p.screenY;
  const h  = Math.max(6, 10 * p.scale);
  const sq = 10;
  const sqW = (rx - lx) / sq;
  for (let i = 0; i < sq; i++) {
    ctx.fillStyle = (i % 2 === 0) ? '#fff' : '#000';
    ctx.fillRect(lx + i*sqW, y - h, sqW, h);
    ctx.fillStyle = (i % 2 === 1) ? '#fff' : '#000';
    ctx.fillRect(lx + i*sqW, y,     sqW, h);
  }
}

// ─── Virus ───────────────────────────────────────────────────────────────────
function drawVirus(v) {
  const p  = getPerspective(v.z);
  const sx = getVirusScreenX(v.lane, v.z);
  const sy = p.screenY;
  const s  = p.scale * v.type.size;

  if (v.crushed) {
    // Flat squished state
    const fadeAlpha = v.z > 0.95 ? Math.max(0, 1 - (v.z - 0.95) / 0.20) : 1;
    ctx.globalAlpha = fadeAlpha;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1.7, 0.20);   // squash flat

    // Splat body
    ctx.beginPath();
    ctx.arc(0, 0, s * 1.3, 0, Math.PI*2);
    ctx.fillStyle = v.type.color + 'cc';
    ctx.fill();
    ctx.strokeStyle = v.type.color;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Flattened spikes radiate outward
    for (let i = 0; i < v.type.spikes; i++) {
      const a = (i / v.type.spikes) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*s,          Math.sin(a)*s);
      ctx.lineTo(Math.cos(a)*(s*1.9+6),  Math.sin(a)*(s*1.9+6));
      ctx.strokeStyle = v.type.color;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(Math.cos(a)*(s*1.9+4), Math.sin(a)*(s*1.9+4), 3, 0, Math.PI*2);
      ctx.fillStyle = v.type.color;
      ctx.fill();
    }

    // X eyes
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(1.5, 2.5 * p.scale);
    const ex = s*0.3, es = s*0.22;
    for (const side of [-1, 1]) {
      const ox = side * ex;
      ctx.beginPath(); ctx.moveTo(ox-es, -es); ctx.lineTo(ox+es,  es); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox+es, -es); ctx.lineTo(ox-es,  es); ctx.stroke();
    }

    ctx.restore();
    ctx.globalAlpha = 1;

    // Label outside squash transform
    if (fadeAlpha > 0.2) {
      ctx.globalAlpha = fadeAlpha;
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(7, 10 * p.scale)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('\u2605 ' + v.type.name + ' \u2605', sx, sy + s*0.35 + 12*p.scale);
      ctx.globalAlpha = 1;
    }
    return;
  }

  // Normal (alive) virus
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(v.rot);

  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI*2);
  ctx.fillStyle = v.type.color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();

  for (let i = 0; i < v.type.spikes; i++) {
    const a = (i / v.type.spikes) * Math.PI * 2;
    const tip = s + 7 * p.scale;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s, Math.sin(a)*s);
    ctx.lineTo(Math.cos(a)*tip, Math.sin(a)*tip);
    ctx.strokeStyle = v.type.color;
    ctx.lineWidth = 2.5 * p.scale;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(Math.cos(a)*tip, Math.sin(a)*tip, 2.5*p.scale, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  // Face
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-s*0.28, -s*0.2, s*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.28, -s*0.2, s*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.arc(0, s*0.1, s*0.32, 0, Math.PI);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(7, 10 * p.scale)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(v.type.name, 0, s + 11*p.scale);

  ctx.restore();
}

// ─── Car (rear-view, front pointing toward horizon) ──────────────────────────
function drawCar() {
  ctx.save();
  ctx.translate(carX, CAR_Y);
  ctx.rotate(carSteer * 0.09);   // lean into turn

  // ── Shadow ──
  ctx.beginPath();
  ctx.ellipse(0, 52, 72, 16, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();

  // ── Outer body silhouette ──
  // Front (toward horizon) is UP (negative y), rear is DOWN (positive y)
  ctx.beginPath();
  ctx.moveTo(-58, 42);   // rear-left corner  (visible to player)
  ctx.lineTo( 58, 42);   // rear-right corner
  ctx.lineTo( 52,  4);   // right flank mid
  ctx.lineTo( 38,-48);   // right front corner
  ctx.lineTo(-38,-48);   // left front corner
  ctx.lineTo(-52,  4);   // left flank mid
  ctx.closePath();
  ctx.fillStyle = '#cc0000';
  ctx.fill();
  ctx.strokeStyle = '#880000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // ── Roof cabin (darker, inset) ──
  ctx.beginPath();
  ctx.moveTo(-26, 24);
  ctx.lineTo( 26, 24);
  ctx.lineTo( 20,-28);
  ctx.lineTo(-20,-28);
  ctx.closePath();
  ctx.fillStyle = '#991100';
  ctx.fill();

  // ── Rear window (player sees back of car) ──
  ctx.beginPath();
  ctx.moveTo(-20, 21);
  ctx.lineTo( 20, 21);
  ctx.lineTo( 14, -3);
  ctx.lineTo(-14, -3);
  ctx.closePath();
  ctx.fillStyle = 'rgba(80,160,255,0.65)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,210,255,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── Front windshield (small, farther away) ──
  ctx.beginPath();
  ctx.moveTo(-14,-28);
  ctx.lineTo( 14,-28);
  ctx.lineTo( 10,-44);
  ctx.lineTo(-10,-44);
  ctx.closePath();
  ctx.fillStyle = 'rgba(80,160,255,0.55)';
  ctx.fill();

  // ── Side accent stripes ──
  ctx.strokeStyle = '#ffdd00';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-52, 38); ctx.lineTo(-46,-44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 52, 38); ctx.lineTo( 46,-44); ctx.stroke();

  // ── Rear bumper ──
  ctx.beginPath();
  ctx.moveTo(-58, 40); ctx.lineTo(58, 40);
  ctx.lineTo(55, 50);  ctx.lineTo(-55,50);
  ctx.closePath();
  ctx.fillStyle = '#770000';
  ctx.fill();

  // ── Taillights ──
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff2200';
  ctx.fillRect(-56, 26, 24, 12);
  ctx.fillRect( 32, 26, 24, 12);
  // Centre brake light
  ctx.fillStyle = '#ff6600';
  ctx.fillRect(-10, 28, 20, 8);
  ctx.shadowBlur = 0;

  // ── License plate ──
  ctx.fillStyle = '#fff';
  ctx.fillRect(-24, 41, 48, 13);
  ctx.fillStyle = '#0000aa';
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('SANOFI', 0, 52);

  // ── Rear wheels (large, at the bottom) ──
  for (const wx of [-64, 64]) {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(wx, 32, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.arc(wx, 32, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(wx, 32,  5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 5; s++) {
      const a = (s/5)*Math.PI*2 + frameCount*0.22;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(a)*3,  32 + Math.sin(a)*3);
      ctx.lineTo(wx + Math.cos(a)*11, 32 + Math.sin(a)*11);
      ctx.stroke();
    }
  }

  // ── Front wheels (smaller — perspective makes them appear smaller) ──
  for (const wx of [-42, 42]) {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(wx, -40, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(wx, -40,  7, 0, Math.PI*2); ctx.fill();
  }

  // ── Ferrari horse ──
  ctx.font = '15px serif';
  ctx.textAlign = 'center';
  ctx.fillText('\uD83D\uDC0E', 0, -18);

  // ── Headlights (front, small) ──
  ctx.shadowColor = '#ffffaa';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffffcc';
  ctx.fillRect(-36,-50, 14, 5);
  ctx.fillRect( 22,-50, 14, 5);
  ctx.shadowBlur = 0;

  // Exhaust smoke from rear corners
  if (speed > 0.8) {
    for (const [ex, ey] of [[-48, 50], [48, 50]]) {
      particles.push({
        x: carX + ex + (Math.random()-0.5)*4,
        y: CAR_Y + ey,
        vx: (Math.random()-0.5) * 1.5,
        vy: speed * 1.8 + Math.random()*2,  // drift downward (behind car)
        life: 28, maxLife: 28,
        color: `hsl(${15+Math.random()*20},65%,${50+Math.random()*25}%)`
      });
    }
  }

  ctx.restore();
}

// ─── Particles ───────────────────────────────────────────────────────────────
function drawParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    const alpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4 * alpha, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── Roy ─────────────────────────────────────────────────────────────────────
function drawRoy() {
  const rc = royCtx;
  rc.clearRect(0, 0, 160, 130);

  // Head
  rc.beginPath(); rc.arc(80, 58, 32, 0, Math.PI*2);
  rc.fillStyle = '#f5c5a0'; rc.fill();
  rc.strokeStyle = '#cc9966'; rc.lineWidth = 2; rc.stroke();

  // Hair
  rc.fillStyle = '#553300';
  rc.beginPath(); rc.arc(80, 30, 32, Math.PI, Math.PI*2); rc.fill();

  // Eyes
  for (const [ex, ep] of [[66, 66], [94, 90]]) {
    rc.fillStyle = '#fff'; rc.beginPath(); rc.arc(ex, 53, 8, 0, Math.PI*2); rc.fill();
    rc.fillStyle = '#1a1a00'; rc.beginPath(); rc.arc(ep > 80 ? 95 : 67, 54, 4.5, 0, Math.PI*2); rc.fill();
    rc.fillStyle = '#fff'; rc.beginPath(); rc.arc(ep > 80 ? 96 : 68, 53, 1.8, 0, Math.PI*2); rc.fill();
  }

  // Eyebrows (raised — excited)
  rc.strokeStyle = '#553300'; rc.lineWidth = 3;
  rc.beginPath(); rc.moveTo(58,43); rc.quadraticCurveTo(66,39,74,43); rc.stroke();
  rc.beginPath(); rc.moveTo(86,43); rc.quadraticCurveTo(94,39,102,43); rc.stroke();

  // Big smile
  rc.beginPath(); rc.arc(80,60,20,0.1,Math.PI-0.1);
  rc.strokeStyle = '#cc3300'; rc.lineWidth = 3.5; rc.stroke();
  rc.fillStyle = '#fff'; rc.fillRect(65,67,30,8);
  rc.strokeStyle = '#ddd'; rc.lineWidth = 1;
  for (let i = 1; i < 5; i++) rc.strokeRect(65+i*6,67,6,8);

  // Neck + lab coat
  rc.fillStyle = '#f5c5a0'; rc.fillRect(69,87,22,14);
  rc.fillStyle = '#fff'; rc.fillRect(44,99,72,31); rc.strokeRect(44,99,72,31);

  // Collar
  rc.fillStyle = '#fff';
  rc.beginPath(); rc.moveTo(69,101); rc.lineTo(52,113); rc.lineTo(80,109); rc.closePath(); rc.fill();
  rc.beginPath(); rc.moveTo(91,101); rc.lineTo(108,113); rc.lineTo(80,109); rc.closePath(); rc.fill();

  rc.fillStyle = '#0044aa'; rc.font = 'bold 8px Courier New'; rc.textAlign = 'center';
  rc.fillText('SANOFI', 80, 118);

  // Waving arm
  const wave = Math.sin(frameCount * 0.22) * 22;
  rc.save();
  rc.translate(44, 104);
  rc.rotate((-0.5 + wave/100) * Math.PI);
  rc.fillStyle = '#fff'; rc.fillRect(-6, 0, 12, 28);
  rc.fillStyle = '#f5c5a0'; rc.beginPath(); rc.arc(0,31,9,0,Math.PI*2); rc.fill();
  rc.restore();
}

// ─── Spawn / Roy helpers ─────────────────────────────────────────────────────
function spawnVirus() {
  const lane = [-1, 0, 1][Math.floor(Math.random() * 3)];
  const type = VIRUS_TYPES[Math.floor(Math.random() * VIRUS_TYPES.length)];
  viruses.push({ lane, z: 0.01, type, rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*0.05, crushed: false, crushedTimer: 0 });
}

function showRoy(phrase) {
  royVisible = true;
  royTimer = 200;
  document.getElementById('royBubble').textContent = phrase;
  document.getElementById('royContainer').classList.add('visible');
}
function hideRoy() {
  royVisible = false;
  document.getElementById('royContainer').classList.remove('visible');
}

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (gameState === 'menu' && (e.key === ' ' || e.key === 'Enter')) startGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// ─── Game lifecycle ───────────────────────────────────────────────────────────
function startGame() {
  getAudioCtx();
  stopBGM();
  gameState = 'playing';
  score = 0; crushed = 0;
  timerFloat = 30; timer = 30;
  speed = 0; maxSpeed = 3;
  carX = W / 2; carSteer = 0;
  frameCount = 0; roadOffset = 0;
  viruses = []; particles = [];
  finishMode = false; finishProgress = 0;
  difficulty = 1; royVisible = false;
  document.getElementById('overlay').style.display = 'none';
  playBGM();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function endGame(win) {
  gameState = win ? 'win' : 'gameover';
  stopBGM();
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = win
    ? `<h1>YOU WIN!</h1><h2>VIRUSES CRUSHED!</h2>
       <div id="scoreDisplay">SCORE: ${score}</div>
       <p style="color:#0f0;font-size:17px">SANOFI SAVES THE DAY!</p>
       <p style="margin-top:10px">Roy is VERY proud of you.</p>
       <button id="startBtn" onclick="startGame()">PLAY AGAIN</button>`
    : `<h1>GAME OVER</h1><h2>THE VIRUSES WIN... FOR NOW</h2>
       <div id="scoreDisplay">SCORE: ${score}</div>
       <p>Crushed: ${crushed}/100</p>
       <button id="startBtn" onclick="startGame()">TRY AGAIN</button>`;
  win ? playWinSound() : playGameOverSound();
}

// ─── Collision detection ──────────────────────────────────────────────────────
function checkCollisions() {
  const carHalfW = 62;

  viruses.forEach(v => {
    if (v.crushed) return;
    // Car occupies roughly z = 0.75–0.98 in screen space
    if (v.z < 0.72 || v.z > 1.00) return;
    const vx = getVirusScreenX(v.lane, v.z);
    if (Math.abs(vx - carX) > carHalfW + v.type.size * 12) return;

    v.crushed = true;
    v.crushedTimer = 160;
    crushed++;
    score += Math.round(v.type.pts * difficulty);
    timerFloat += 3;
    timer = Math.ceil(timerFloat);

    showRoy(ROY_PHRASES[Math.floor(Math.random() * ROY_PHRASES.length)]);
    playCrunchSound();

    // Splat burst particles
    const p = getPerspective(v.z);
    for (let i = 0; i < 18; i++) {
      particles.push({
        x: vx, y: p.screenY,
        vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 2,
        life: 50, maxLife: 50, color: v.type.color
      });
    }

    if (crushed >= 100) { finishMode = true; finishProgress = 0; }
  });
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastSpawn = 0;

function gameLoop(ts) {
  if (gameState !== 'playing') return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  frameCount++;

  difficulty = 1 + crushed * 0.02;
  maxSpeed   = 3 + difficulty * 0.4;
  if (speed < maxSpeed) speed = Math.min(maxSpeed, speed + 0.04);

  // Steering with lean
  const steerSpeed = 5 + speed * 0.4;
  const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
  const right = keys['ArrowRight'] || keys['d'] || keys['D'];
  if (left)  carX = Math.max(W/2 - ROAD_W_NEAR/2 + 70, carX - steerSpeed);
  if (right) carX = Math.min(W/2 + ROAD_W_NEAR/2 - 70, carX + steerSpeed);
  const targetSteer = right ? 1 : left ? -1 : 0;
  carSteer += (targetSteer - carSteer) * 0.14;

  // Road scroll
  roadOffset = (roadOffset + speed * 0.016) % 1;

  // Move viruses; freeze z when crushed so splat stays on road surface
  viruses.forEach(v => {
    if (!v.crushed) {
      v.z += speed * 0.004;   // slow approach = more reaction time
      v.rot += v.rotSpeed;
    } else {
      v.crushedTimer--;
    }
  });
  viruses = viruses.filter(v => v.z < 1.20 && (!v.crushed || v.crushedTimer > 0));

  // Spawn
  const spawnInterval = Math.max(38, 95 - difficulty * 12);
  if (frameCount - lastSpawn > spawnInterval) {
    spawnVirus();
    lastSpawn = frameCount;
  }

  checkCollisions();

  // Finish line approach
  if (finishMode) {
    finishProgress += speed * 0.008;
    if (finishProgress >= 1) { endGame(true); return; }
  }

  // Timer
  timerFloat -= dt;
  timer = Math.max(0, Math.ceil(timerFloat));
  if (timerFloat <= 0 && !finishMode) { endGame(false); return; }

  // Roy fade
  if (royVisible && --royTimer <= 0) hideRoy();

  playEngineNote();

  // ── Draw frame ──
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawRoad();

  // Viruses, far → near
  [...viruses].sort((a,b) => a.z - b.z).forEach(drawVirus);

  drawParticles();
  drawCar();

  // CRT scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.025)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Speed streak lines
  if (speed > 2.5) {
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const lx = W/2 - ROAD_W_NEAR/2 + Math.random() * ROAD_W_NEAR;
      ctx.strokeStyle = `rgba(255,255,255,${(speed-2.5)*0.04})`;
      ctx.beginPath();
      ctx.moveTo(lx,              H - 80 - Math.random()*60);
      ctx.lineTo(lx+(lx-W/2)*0.08, H - 160 - Math.random()*40);
      ctx.stroke();
    }
  }

  // Low-timer warning flash
  if (timer <= 5 && !finishMode) {
    ctx.fillStyle = `rgba(255,0,0,${0.13 * Math.abs(Math.sin(frameCount * 0.25))})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HUD values
  document.getElementById('scoreHud').textContent   = score;
  document.getElementById('crushedHud').textContent = crushed;
  document.getElementById('speedHud').textContent   = Math.round(speed * 30);
  document.getElementById('timerHud').textContent   = timer;

  drawRoy();
  requestAnimationFrame(gameLoop);
}

// Draw Roy on load
drawRoy();
</script>
</body>
</html>
